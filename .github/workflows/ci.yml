name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-core:
    name: Core / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements_core.txt
      - name: Install core package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
      - name: Run tests
        run: python -m pytest -q

  examples-and-distribution:
    name: Examples and distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Ipopt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            coinor-libipopt-dev \
            gfortran \
            libblas-dev \
            liblapack-dev \
            pkg-config
      - name: Install package, examples, and quality tools
        run: |
          python -m pip install --upgrade build ruff twine
          python -m pip install ".[ipopt,examples]"
      - name: Check maintained examples
        run: |
          python -m ruff format --check examples
          python -m ruff check examples
          python -m compileall -q examples
      - name: Smoke-test representative examples
        env:
          MPLBACKEND: Agg
        run: |
          python examples/linear_quadratic_regulator.py --no-show
          python examples/multiphase_batch_reactor.py --no-show
      - name: Build and validate distributions
        run: |
          python -m build
          python packaging/check_dist.py
          python -m twine check --strict dist/*
      - name: Install and import the wheel in isolation
        run: |
          python -m venv .dist-check
          .dist-check/bin/python -m pip install dist/*.whl
          .dist-check/bin/python -I -c "import pockit; import pockit.lobatto; import pockit.radau; import pockit.optimizer.scipy"
