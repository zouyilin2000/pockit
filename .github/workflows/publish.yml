name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify release tag matches project version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          with Path("pyproject.toml").open("rb") as stream:
              version = tomllib.load(stream)["project"]["version"]

          expected = f"v{version}"
          if re.fullmatch(r"v\d+\.\d+\.\d+", tag) is None or tag != expected:
              raise SystemExit(
                  f"Release tag {tag!r} must be {expected!r} and use vX.Y.Z format"
              )
          PY
      - name: Verify release commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "Release commit must be reachable from main" >&2
            exit 1
          }
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade build pytest ruff twine
          python -m pip install .
          python -m pytest -q
          python -m ruff format --check examples
          python -m ruff check examples
          python -m compileall -q examples
          python -m build
          python packaging/check_dist.py
          python -m twine check --strict dist/*
      - name: Install and import the wheel in isolation
        run: |
          python -m venv .dist-check
          .dist-check/bin/python -m pip install dist/*.whl
          .dist-check/bin/python -I -c "import pockit; import pockit.lobatto; import pockit.radau; import pockit.optimizer.scipy"
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pockit-optimal-control
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
