[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "pockit-optimal-control"
version = "0.1.0"
description = "Python Optimal Control KIT"
authors = [
    { name = "Yilin Zou", email = "safe.dust4704@fastmail.com" }
]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["optimal control", "trajectory optimization", "pseudospectral methods"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26.0",
    "sympy>=1.12",
    "scipy>=1.11.3",
    "numba>=0.58.1",
]

[project.optional-dependencies]
ipopt = ["cyipopt>=1.3.0"]
examples = ["matplotlib>=3.8"]

[project.urls]
Homepage = "https://github.com/zouyilin2000/pockit"
Issues = "https://github.com/zouyilin2000/pockit/issues"
Documentation = "https://pockit.pages.dev"
Source = "https://github.com/zouyilin2000/pockit"
Changelog = "https://github.com/zouyilin2000/pockit/releases"

[tool.hatch.build.targets.sdist]
only-include = [
    "pyproject.toml",
    "README.md",
    "LICENSE",
    "pockit",
    "tests",
    "examples",
    "images",
    "packaging",
]
[tool.hatch.build.targets.sdist.force-include]
"images/lqr_readme.png" = "images/lqr_readme.png"

[tool.hatch.build.targets.wheel]
packages = ["pockit"]
